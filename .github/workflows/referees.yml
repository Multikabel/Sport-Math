name: Generate Referee Tables

on:
  workflow_dispatch:

permissions: contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install pandas requests

    - name: Run script
      run: python download_referees.py

    - name: Commit results
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add referees_laliga.csv referees_seriea.csv
        git commit -m "Update referee tables"
        git push
